# Render Blueprint for the FastAPI backend (New > Blueprint, pick this repo).
services:
  - type: web
    name: food-ordering-analytics-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/meta
    envVars:
      # Your Netlify URL, e.g. https://food-ordering-analytics.netlify.app (comma-separate several).
      - key: CORS_ORIGINS
        sync: false
